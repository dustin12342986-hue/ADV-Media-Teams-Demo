<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pathfinder — Demo</title>
<!--
  PATHFINDER, DEMO BUILD -- THE VIEW
  ==================================
  Pathfinder itself. It carries no access code, because it is never opened
  on its own: the Pathfinder tab in ADV Media Teams frames it, and so does
  pathfinder-demo.html, which is the copy you hand to a visiting EIC. Those
  two put the gate and the watermark on.

  One Pathfinder, framed in two places, so there is nothing to keep in step.

  Everything in this file describes a venue that does not exist. The rooms,
  boxes, racks, patchbays, wire numbers, drawing sheets and panel layouts
  were all made up for this demo. No part of any real facility appears here,
  and nothing in this file connects to a real database.
-->
<style>
  /* Fallback only. adv-theme.js loads after this and redefines the same
     variables at the same specificity, so the shared theme wins wherever it
     is present. These values are what the page falls back to when the file
     is opened on its own, which is why they are the dark set: dark is the
     shared theme's default too. --mono is ours; the shared theme has no
     monospace variable. */
  :root {
    --bg:#0f1115; --panel:#171a20; --panel2:#1f232b; --border:#2b303a;
    --text:#e8eaed; --text-muted:#a2a9b4; --text-faint:#747c88;
    --accent:#4d8dfc; --accent-ink:#06101f;
    --warn-bg:#2a2214; --warn-ink:#e3bf80;
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.4);
    --font: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  /* html[...] and not :root[...], so this matches the shared theme's own
     selector exactly. At equal specificity the later rule wins, and the
     theme's style element is appended after this one. Written as :root the
     fallback outranked the real theme and the light background came out a
     shade off on this page alone. */
  html[data-theme="light"] {
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f4; --border:#d7dae1;
    --text:#14161a; --text-muted:#525862; --text-faint:#80868f;
    --accent:#1f6feb; --accent-ink:#ffffff;
    --warn-bg:#fdf3e0; --warn-ink:#7a5218;
    --shadow:0 1px 3px rgba(0,0,0,.09), 0 8px 24px rgba(0,0,0,.06);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; min-height:100%; }
  body {
    background:var(--bg); color:var(--text); font-family:var(--font);
    display:flex; flex-direction:column; min-height:100vh; font-size:14px;
  }
  #root { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }

  .bar {
    display:flex; align-items:center; gap:10px; flex:0 0 auto; flex-wrap:wrap;
    padding:9px 14px; background:var(--panel); border-bottom:1px solid var(--border);
  }
  .bar h1 { font-size:14.5px; font-weight:800; margin:0; letter-spacing:.2px; }
  .bar .sub { font-size:11px; color:var(--text-faint); margin-top:1px; }
  .brand-logo { height:30px; width:auto; flex:0 0 auto; }
  /* The mark is light grey and vanishes on a light background. The shared
     theme already inverts .brand-logo for every light theme it knows about,
     including the generated ones, so the gate logo carries that class too
     and this rule only has to cover the standalone fallback. */
  html[data-theme="light"] .brand-logo { filter:invert(1) brightness(.4); }
  .bar-spacer { margin-left:auto; }
  .pill {
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:9px; padding:8px 12px; font-size:12.5px; font-weight:800;
    font-family:inherit; cursor:pointer; flex:0 0 auto; text-decoration:none;
  }
  .pill:active { transform:translateY(1px); }
  .tag {
    font-size:10px; font-weight:800; letter-spacing:.9px; text-transform:uppercase;
    padding:3px 7px; border-radius:6px; background:var(--warn-bg); color:var(--warn-ink);
    border:1px solid var(--border);
  }

  /* ---------------------------------------------------------------- gate */
  .gate-wrap { flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:20px; }
  .gate {
    width:100%; max-width:390px; background:var(--panel); border:1px solid var(--border);
    border-radius:16px; padding:22px; box-shadow:var(--shadow);
  }
  .gate-logo { height:42px; width:auto; display:block; margin:0 auto 16px; }
  .gate h2 { font-size:18px; font-weight:800; margin:0 0 6px; text-align:center; }
  .gate p { font-size:12.5px; color:var(--text-muted); line-height:1.55; margin:0 0 18px; text-align:center; }
  .gate label {
    display:block; font-size:11px; font-weight:800; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:.7px; margin-bottom:7px;
  }
  .gate input {
    width:100%; padding:13px 14px; border-radius:11px; font-size:16px; font-family:var(--mono);
    letter-spacing:1px; text-transform:uppercase;
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
  }
  .gate .go {
    width:100%; margin-top:12px; padding:14px 0; border:none; border-radius:11px;
    background:var(--accent); color:var(--accent-ink); font-size:15px; font-weight:800;
    font-family:inherit; cursor:pointer;
  }
  .gate .ghost {
    width:100%; margin-top:10px; padding:12px 0; border-radius:11px; cursor:pointer;
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    font-size:13px; font-weight:800; font-family:inherit;
  }
  .gate .rule { margin:18px 0 14px; border-top:1px solid var(--border); }
  .legal {
    margin-top:18px; font-size:10.5px; line-height:1.6; color:var(--text-faint); text-align:center;
  }
  .msg { margin-top:9px; font-size:12px; min-height:16px; }
  .msg.bad { color:#c0392b; }
  :root[data-theme="dark"] .msg.bad { color:#ff8a7a; }

  /* ------------------------------------------------------------ content */
  .tabs {
    display:flex; gap:6px; overflow-x:auto; padding:9px 14px; flex:0 0 auto;
    background:var(--panel); border-bottom:1px solid var(--border); scrollbar-width:thin;
  }
  .tab {
    flex:0 0 auto; padding:7px 12px; border-radius:999px; font-size:12.5px; font-weight:700;
    border:1px solid var(--border); background:var(--panel2); color:var(--text-muted);
    cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .tab[aria-selected="true"] { background:var(--accent); color:var(--accent-ink); border-color:transparent; }

  .wrap { flex:1 1 auto; min-height:0; overflow:auto; padding:16px 14px 60px; }
  .inner { max-width:1040px; margin:0 auto; }
  h2.view { font-size:17px; font-weight:800; margin:0 0 4px; }
  p.lede { font-size:13px; color:var(--text-muted); margin:0 0 16px; line-height:1.55; }

  .card {
    background:var(--panel); border:1px solid var(--border); border-radius:13px;
    padding:14px 15px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .card h3 { margin:0 0 3px; font-size:14px; font-weight:800; }
  .card .k { font-size:11.5px; color:var(--text-faint); font-family:var(--mono); }
  .card p { margin:7px 0 0; font-size:13px; color:var(--text-muted); line-height:1.55; }

  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint); font-weight:800; }
  td.m, th.m { font-family:var(--mono); white-space:nowrap; }
  tbody tr:hover { background:var(--panel2); }
  .scroller { overflow-x:auto; }

  .search {
    width:100%; padding:12px 14px; border-radius:11px; font-size:15px; font-family:inherit;
    background:var(--panel); border:1px solid var(--border); color:var(--text); margin-bottom:12px;
  }
  .chiprow { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .chip {
    font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:999px; cursor:pointer;
    border:1px solid var(--border); background:var(--panel2); color:var(--text-muted); font-family:var(--mono);
  }
  .chip:hover { border-color:var(--accent); color:var(--text); }

  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); }
  .flowline { display:flex; gap:12px; align-items:flex-start; margin-bottom:0; }
  .flowdot {
    flex:0 0 auto; width:11px; height:11px; border-radius:50%; background:var(--accent);
    margin-top:5px; position:relative;
  }
  .flowline:not(:last-child) .flowdot::after {
    content:""; position:absolute; left:50%; top:13px; width:2px; height:calc(100% + 24px);
    transform:translateX(-50%); background:var(--border);
  }
  .flowbody { padding-bottom:22px; }

  .units { font-family:var(--mono); font-size:12px; line-height:1.85; color:var(--text-muted); margin:8px 0 0; }
  .units div { border-bottom:1px dashed var(--border); padding:1px 0; }

  svg.panel { width:100%; height:auto; display:block; border-radius:10px; }
  svg.panel .port { cursor:pointer; }
  svg.panel .port:hover rect { stroke:var(--accent); stroke-width:2.5; }
  .portinfo {
    margin-top:10px; padding:10px 12px; border-radius:10px; font-size:12.5px;
    background:var(--panel2); border:1px solid var(--border); min-height:42px; line-height:1.6;
  }
  .empty { font-size:13px; color:var(--text-faint); padding:18px 0; }

  /* ---------------------------------------------------------- watermark */
  #wm {
    position:fixed; inset:0; pointer-events:none; z-index:9999;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #wm span {
    font-size:min(5.5vw, 42px); font-weight:800; letter-spacing:2px; white-space:nowrap;
    color:var(--text); opacity:.055; transform:rotate(-28deg); text-align:center; line-height:2.4;
  }
  #clockbar {
    flex:0 0 auto; padding:7px 14px; font-size:12px; font-weight:700;
    background:var(--warn-bg); color:var(--warn-ink); border-bottom:1px solid var(--border);
    display:flex; gap:10px; align-items:center;
  }
  .foot { font-size:10.5px; color:var(--text-faint); line-height:1.6; text-align:center; padding:22px 14px 30px; }
</style>
<!-- Shared appearance, so this matches whatever page is framing it. -->
<script src="adv-theme.js"></script>
<!-- Same origin as the page framing this, so the same session record. A tap
     in here is activity, and without it a rep who spent twenty-five minutes
     in Pathfinder was signed out for sitting still. -->
<script src="demo-session.js"></script>

const CABLES = D.cables.concat(D.fiber);

/* ================================================================ helpers */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function el(id) { return document.getElementById(id); }

// A box, a room or a bay: whatever the id is, say it in words.
function whereIs(id) {
  const key = String(id || "").trim().toUpperCase();
  if (D.place[key]) return D.place[key].name + " (" + D.place[key].kind.toLowerCase() + ")";
  if (D.rooms[key]) return D.rooms[key].name;
  const bay = D.bays.filter((b) => b.id === key)[0];
  if (bay) return bay.name + ", rack " + bay.rack;
  const rack = D.racks.filter((r) => r.id === key)[0];
  if (rack) return rack.name + " rack, " + (D.rooms[rack.room] ? D.rooms[rack.room].name : rack.room);
  return key;
}

function typeWords(t) { return D.types[t] || t; }

/* ==================================================================== app */
const TABS = [
  ["find",     "Find it"],
  ["flow",     "Signal flow"],
  ["panels",   "Panels"],
  ["gameday",  "Game day"],
  ["rooms",    "Rooms"],
  ["racks",    "Racks"],
  ["cables",   "Cables"],
  ["speakers", "Speakers"],
  ["gear",     "Gear"],
  ["sheets",   "Sheets"],
  ["words",    "Glossary"],
];
let tab = "find";

function renderApp() {
  // No logo, no Leave and no Appearance: this page is always inside a frame,
  // and the page around it owns all three, the product name included. This
  // bar carries the venue instead: Pathfinder framed inside a page already
  // headed Pathfinder said the same word twice, and two names for one screen
  // in front of a client is a question you have to stop and answer.
  el("root").innerHTML =
    '<div class="bar">' +
      '<div><h1>' + esc(D.venue) + '</h1><div class="sub">Sample venue, sample data</div></div>' +
      '<div class="bar-spacer"></div>' +
    '</div>' +
    '<div class="tabs" role="tablist">' +
      TABS.map(([id, label]) =>
        '<button class="tab" role="tab" data-tab="' + id + '" aria-selected="' +
        (id === tab) + '">' + esc(label) + '</button>').join("") +
    '</div>' +
    '<div class="wrap"><div class="inner" id="view"></div>' +
      '<div class="foot">&copy; ' + new Date().getFullYear() +
      ' ADV Media Limited Company. Sample venue, sample data.</div>' +
    '</div>';

  document.querySelectorAll("[data-tab]").forEach((b) => {
    b.onclick = () => {
      tab = b.dataset.tab;
      document.querySelectorAll("[data-tab]").forEach((x) =>
        x.setAttribute("aria-selected", String(x.dataset.tab === tab)));
      draw();
      const w = document.querySelector(".wrap");
      if (w) w.scrollTop = 0;
    };
  });
  draw();
}




function draw() {
  const v = el("view");
  if (!v) return;
  v.innerHTML = ({
    find: viewFind, flow: viewFlow, panels: viewPanels, gameday: viewGameday,
    rooms: viewRooms, racks: viewRacks, cables: viewCables, speakers: viewSpeakers,
    gear: viewGear, sheets: viewSheets, words: viewWords,
  }[tab] || viewFind)();
  if (tab === "find") wireFind();
  if (tab === "panels") wirePanels();
  if (tab === "cables") wireCables();
}

/* ------------------------------------------------------------- find it */
function viewFind() {
  return '<h2 class="view">Find it</h2>' +
    '<p class="lede">Type a wire number, a box, a room, a rack or a patch port. ' +
      'This is the screen people actually use, standing on the field at 5pm.</p>' +
    '<input class="search" id="q" placeholder="BC-014, FB-02, VPB-A 9, press box…" autocomplete="off" />' +
    '<div class="chiprow">' +
      ["FB-01", "WB-02", "VPB-D", "APB-1 33", "BC-021", "press box", "fiber"]
        .map((c) => '<button class="chip" data-chip="' + esc(c) + '">' + esc(c) + '</button>').join("") +
    '</div><div id="hits"></div>';
}

function wireFind() {
  const q = el("q");
  const run = () => { el("hits").innerHTML = findHits(q.value); };
  q.oninput = run;
  document.querySelectorAll("[data-chip]").forEach((b) => {
    b.onclick = () => { q.value = b.dataset.chip; run(); q.focus(); };
  });
  run();
}

function findHits(raw) {
  const s = String(raw || "").trim().toLowerCase();
  if (!s) return '<div class="empty">Start typing. Partial matches are fine.</div>';

  const out = [];

  const cables = CABLES.filter((c) =>
    c.wire.toLowerCase().includes(s) || c.origin.toLowerCase().includes(s) ||
    c.dest.toLowerCase().includes(s) || c.bay.toLowerCase().includes(s) ||
    typeWords(c.type).toLowerCase().includes(s) || c.type.toLowerCase().includes(s));
  if (cables.length) {
    out.push('<div class="card"><h3>Cable runs</h3><div class="k">' + cables.length +
      ' match' + (cables.length === 1 ? "" : "es") + '</div><div class="scroller">' +
      cableTable(cables.slice(0, 40)) + '</div>' +
      (cables.length > 40 ? '<p>Showing the first 40. Narrow it down.</p>' : '') + '</div>');
  }

  const places = Object.keys(D.place).filter((k) =>
    k.toLowerCase().includes(s) || D.place[k].name.toLowerCase().includes(s));
  places.forEach((k) => {
    const mine = CABLES.filter((c) => c.origin === k);
    out.push('<div class="card"><h3>' + esc(k) + ' · ' + esc(D.place[k].name) + '</h3>' +
      '<div class="k">' + esc(D.place[k].kind) + '</div>' +
      '<p>' + (mine.length
        ? mine.length + ' run' + (mine.length === 1 ? "" : "s") + ' land here: ' +
          esc(mine.map((c) => c.wire + " to " + c.dest).join(", ")) + '.'
        : 'Nothing terminates here in this sample.') + '</p></div>');
  });

  const rooms = Object.keys(D.rooms).filter((k) =>
    k.toLowerCase().includes(s) || D.rooms[k].name.toLowerCase().includes(s));
  rooms.forEach((k) => {
    const racks = D.racks.filter((r) => r.room === k);
    out.push('<div class="card"><h3>' + esc(k) + ' · ' + esc(D.rooms[k].name) + '</h3>' +
      '<p>' + esc(D.rooms[k].note) +
      (racks.length ? ' Racks here: ' + esc(racks.map((r) => r.id).join(", ")) + '.' : '') +
      '</p></div>');
  });

  const bays = D.bays.filter((b) =>
    b.id.toLowerCase().includes(s) || b.name.toLowerCase().includes(s) || b.use.toLowerCase().includes(s));
  bays.forEach((b) => {
    const on = CABLES.filter((c) => c.bay === b.id);
    out.push('<div class="card"><h3>' + esc(b.id) + ' · ' + esc(b.name) + '</h3>' +
      '<div class="k">' + b.ports + ' ports, rack ' + esc(b.rack) + '</div>' +
      '<p>' + esc(b.use) + '. ' + on.length + ' of ' + b.ports + ' ports are used in this sample.</p></div>');
  });

  const sheets = D.sheets.filter((r) =>
    String(r[1]).toLowerCase().includes(s) || String(r[2]).toLowerCase().includes(s) ||
    String(r[4]).toLowerCase().includes(s));
  if (sheets.length) {
    out.push('<div class="card"><h3>Drawing sheets</h3><div class="scroller"><table><thead><tr>' +
      '<th class="m">Sheet</th><th>Title</th><th>What is on it</th></tr></thead><tbody>' +
      sheets.map((r) => '<tr><td class="m">' + esc(r[1]) + '</td><td>' + esc(r[2]) +
        '</td><td>' + esc(r[4]) + '</td></tr>').join("") +
      '</tbody></table></div></div>');
  }

  return out.length ? out.join("") : '<div class="empty">Nothing matched that.</div>';
}

function cableTable(rows) {
  return '<table><thead><tr><th class="m">Wire</th><th class="m">From</th><th class="m">To</th>' +
    '<th>Type</th><th>Cable</th><th class="m">Ft</th><th>Note</th></tr></thead><tbody>' +
    rows.map((c) =>
      '<tr><td class="m">' + esc(c.wire) + '</td>' +
      '<td class="m" title="' + esc(whereIs(c.origin)) + '">' + esc(c.origin) + '</td>' +
      '<td class="m">' + esc(c.dest) + '</td>' +
      '<td>' + esc(typeWords(c.type)) + '</td>' +
      '<td>' + esc(c.make + " " + c.model) + '</td>' +
      '<td class="m">' + esc(c.length) + '</td>' +
      '<td>' + esc(c.note) + '</td></tr>').join("") +
    '</tbody></table>';
}

/* -------------------------------------------------------------- panels */
let panelId = null;

function viewPanels() {
  if (!panelId) panelId = D.bays[0].id;
  return '<h2 class="view">Panels</h2>' +
    '<p class="lede">Tap a port to see what is on it. On the real thing these are ' +
      'photographs of your panels; the sample uses drawings so nothing real is in the file.</p>' +
    '<div class="chiprow">' +
      D.bays.map((b) => '<button class="chip" data-bay="' + esc(b.id) + '"' +
        (b.id === panelId ? ' style="border-color:var(--accent); color:var(--text);"' : '') +
        '>' + esc(b.id) + '</button>').join("") +
    '</div>' +
    '<div class="card" id="panelCard">' + panelSvg(panelId) +
      '<div class="portinfo" id="portinfo">Tap a port.</div></div>';
}

function panelSvg(id) {
  const bay = D.bays.filter((b) => b.id === id)[0];
  if (!bay) return '<div class="empty">No such panel.</div>';
  const used = {};
  CABLES.filter((c) => c.bay === id).forEach((c) => { used[c.port] = c; });

  const perRow = bay.ports > 24 ? 24 : (bay.ports > 12 ? 12 : bay.ports);
  const rows = Math.ceil(bay.ports / perRow);
  const w = 1000, padY = 50;
  // Capped, or a 12-port bay draws ports the size of coasters.
  const cell = Math.min(56, (w - 52) / perRow);
  const padX = (w - cell * perRow) / 2;
  const h = padY + rows * (cell + 18) + 18;

  let s = '<svg class="panel" viewBox="0 0 ' + w + ' ' + Math.round(h) + '" role="img" ' +
    'aria-label="' + esc(bay.id + " " + bay.name) + '">' +
    '<rect x="2" y="2" width="' + (w - 4) + '" height="' + (h - 4) + '" rx="12" ' +
      'fill="var(--panel2)" stroke="var(--border)" stroke-width="2"/>' +
    '<text x="22" y="30" font-size="19" font-weight="800" fill="var(--text)" ' +
      'font-family="var(--mono)">' + esc(bay.id) + '</text>' +
    '<text x="' + (w - 22) + '" y="30" font-size="14" text-anchor="end" fill="var(--text-faint)" ' +
      'font-family="var(--font)">' + esc(bay.name) + ' · rack ' + esc(bay.rack) + '</text>';

  for (let p = 1; p <= bay.ports; p++) {
    const i = p - 1;
    const r = Math.floor(i / perRow), c = i % perRow;
    const x = padX + c * cell + 3;
    const y = padY + r * (cell + 18);
    const size = cell - 6;
    const on = used[p];
    s += '<g class="port" data-port="' + p + '">' +
      '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + size.toFixed(1) +
        '" height="' + size.toFixed(1) + '" rx="' + (size / 2).toFixed(1) + '" ' +
        'fill="' + (on ? "var(--accent)" : "var(--panel)") + '" ' +
        'stroke="var(--border)" stroke-width="1.5"/>' +
      '<circle cx="' + (x + size / 2).toFixed(1) + '" cy="' + (y + size / 2).toFixed(1) + '" r="' +
        (size * 0.22).toFixed(1) + '" fill="var(--panel)" opacity="' + (on ? ".85" : ".35") + '"/>' +
      '<text x="' + (x + size / 2).toFixed(1) + '" y="' + (y + size + 13).toFixed(1) + '" ' +
        'font-size="11" text-anchor="middle" fill="var(--text-faint)" ' +
        'font-family="var(--mono)">' + p + '</text>' +
      '<title>' + esc(on ? on.wire + " from " + on.origin : "Port " + p + ", spare") + '</title>' +
      '</g>';
  }
  return s + '</svg>';
}

function wirePanels() {
  document.querySelectorAll("[data-bay]").forEach((b) => {
    b.onclick = () => { panelId = b.dataset.bay; draw(); };
  });
  const info = el("portinfo");
  document.querySelectorAll(".port").forEach((g) => {
    g.onclick = () => {
      const p = Number(g.dataset.port);
      const c = CABLES.filter((x) => x.bay === panelId && x.port === p)[0];
      if (!c) {
        info.innerHTML = '<strong>Port ' + p + '</strong> is spare in this sample.';
        return;
      }
      info.innerHTML = '<strong>Port ' + p + '</strong> &middot; ' + esc(c.wire) + '<br/>' +
        'From <strong>' + esc(c.origin) + '</strong>, ' + esc(whereIs(c.origin)) + '.<br/>' +
        esc(typeWords(c.type)) + ', ' + esc(c.make + " " + c.model) + ', ' + esc(c.length) + ' ft. ' +
        'Drawn on sheet ' + esc(c.sheet) + '.' + (c.note ? '<br/><em>' + esc(c.note) + '</em>' : '');
    };
  });
}

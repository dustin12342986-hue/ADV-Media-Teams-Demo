<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Running the demo — ADV Media</title>
<!--
  RUNNING THE DEMO
  ================
  For whoever is showing the demo, not for whoever is watching it. It opens
  only for a session signed in with a staff code; a client session gets a
  short notice instead, and the link to this page is not shown before anyone
  has signed in.

  Nothing here is a claim about what ADV Media will do for a client. It only
  describes what is on the screen in front of you.
-->
<style>
  /* Fallback only. adv-theme.js loads after this and redefines the same
     variables at the same specificity, so the shared theme wins wherever it
     is present. Dark, because dark is the shared theme's default too. */
  :root {
    --bg:#0f1115; --panel:#171a20; --panel2:#1f232b; --border:#2b303a;
    --text:#e8eaed; --text-muted:#a2a9b4; --text-faint:#747c88;
    --accent:#4d8dfc; --accent-ink:#06101f;
    --warn-bg:#2a2214; --warn-ink:#e3bf80;
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.4);
    --font: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  /* html[...] and not :root[...], to match the shared theme's own selector.
     At equal specificity the later rule wins, and the theme's style element
     is appended after this one. */
  html[data-theme="light"] {
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f4; --border:#d7dae1;
    --text:#14161a; --text-muted:#525862; --text-faint:#80868f;
    --accent:#1f6feb; --accent-ink:#ffffff;
    --warn-bg:#fdf3e0; --warn-ink:#7a5218;
    --shadow:0 1px 3px rgba(0,0,0,.09), 0 8px 24px rgba(0,0,0,.06);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text); font-family:var(--font);
    font-size:15px; line-height:1.6;
  }
  .bar {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:9px 14px; background:var(--panel); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:5;
  }
  .bar h1 { font-size:14.5px; font-weight:800; margin:0; }
  .brand-logo { height:30px; width:auto; flex:0 0 auto; }
  /* The mark is light grey and vanishes on a light background. The shared
     theme already inverts .brand-logo for every light theme it knows about;
     this only has to cover the standalone fallback. */
  html[data-theme="light"] .brand-logo { filter:invert(1) brightness(.4); }
  .bar-spacer { margin-left:auto; }
  .pill {
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:9px; padding:8px 12px; font-size:12.5px; font-weight:800;
    font-family:inherit; cursor:pointer; text-decoration:none; flex:0 0 auto;
  }
  .pill.go { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .tag {
    font-size:10px; font-weight:800; letter-spacing:.9px; text-transform:uppercase;
    padding:3px 7px; border-radius:6px; background:var(--warn-bg); color:var(--warn-ink);
    border:1px solid var(--border);
  }

  .wrap { max-width:760px; margin:0 auto; padding:26px 16px 70px; }
  h2 { font-size:19px; font-weight:800; margin:34px 0 4px; letter-spacing:-.2px; }
  h2:first-of-type { margin-top:8px; }
  p.sub { color:var(--text-muted); margin:0 0 16px; font-size:14px; }
  .lead { font-size:16.5px; line-height:1.65; margin:0 0 8px; }

  ol.steps { counter-reset:s; list-style:none; padding:0; margin:0; }
  ol.steps li { counter-increment:s; position:relative; padding:0 0 0 42px; margin-bottom:18px; }
  ol.steps li::before {
    content:counter(s); position:absolute; left:0; top:1px;
    width:27px; height:27px; border-radius:50%; background:var(--accent);
    color:var(--accent-ink); font-weight:800; font-size:13.5px;
    display:flex; align-items:center; justify-content:center;
  }
  /* Only the step's own title is a block. Scoped to the direct child, or
     every bold word inside a description broke onto its own line and left a
     stray space in front of the punctuation after it. */
  ol.steps > li > strong { display:block; font-size:15px; }
  ol.steps > li > span { color:var(--text-muted); font-size:14px; display:block; margin-top:2px; }
  ol.steps span strong { color:var(--text); }
  .say {
    display:block; margin-top:7px; padding:8px 11px; border-radius:9px;
    background:var(--panel2); border-left:3px solid var(--accent);
    font-size:13.5px; color:var(--text);
  }
  .say b {
    font-size:10.5px; letter-spacing:.8px; text-transform:uppercase;
    color:var(--text-faint); display:block; margin-bottom:2px; font-weight:800;
  }

  dl.tabs { margin:0; }
  dl.tabs > div {
    display:flex; gap:14px; align-items:baseline; padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  dl.tabs dt { flex:0 0 120px; font-weight:800; font-size:14px; }
  dl.tabs dd { margin:0; color:var(--text-muted); font-size:14px; }

  .card {
    background:var(--panel); border:1px solid var(--border); border-radius:13px;
    padding:15px 17px; margin:16px 0; box-shadow:var(--shadow);
  }
  .card h3 { margin:0 0 4px; font-size:15px; font-weight:800; }
  .card p { margin:6px 0 0; color:var(--text-muted); font-size:14px; }
  .card.note { background:var(--warn-bg); border-color:var(--border); }
  .card.note h3, .card.note p { color:var(--warn-ink); }

  .qa { border-bottom:1px solid var(--border); padding:12px 0; }
  .qa:last-child { border-bottom:0; padding-bottom:0; }
  .qa .q { font-weight:800; font-size:14.5px; margin:0; }
  .qa .a { color:var(--text-muted); font-size:14px; margin:4px 0 0; }

  code {
    font-family:var(--mono); font-size:12.5px; background:var(--panel2);
    border:1px solid var(--border); border-radius:6px; padding:1px 6px;
  }
  .foot {
    text-align:center; color:var(--text-faint); font-size:11px; line-height:1.6;
    padding:30px 16px 10px; border-top:1px solid var(--border); margin-top:34px;
  }
  .locked { max-width:420px; margin:70px auto; text-align:center; padding:0 18px; }
  .locked h2 { margin:0 0 8px; }
  .locked p { color:var(--text-muted); font-size:14px; }
</style>
<script src="adv-theme.js"></script>
<script src="demo-session.js"></script>
<script src="demo-clients.js"></script>
</head>

  <span class="tag">Staff only</span>
  <div class="bar-spacer"></div>
  <button class="pill" data-adv-appearance title="Appearance">Aa</button>
  <button class="pill" data-adv-client title="Which client">Client</button>
  <a class="pill go" href="index.html">Open the app</a>
</div>

<div id="root"></div>

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

const SESSION = window.ADVDemoSession ? window.ADVDemoSession.get() : null;
const STAFF = !!(SESSION && (SESSION.role === "owner" || SESSION.role === "rep"));
const CLIENT = window.ADVDemoClient ? window.ADVDemoClient.get() : null;

// A client watching a demo should never land on the page that tells the rep
// how to run it. The link to here is not shown before sign-in either.
if (!STAFF) {
  document.getElementById("root").innerHTML =
    '<div class="locked">' +
      "<h2>This one is for ADV Media staff</h2>" +
      "<p>It is the notes for running a demo, not part of the demo. Sign in with your " +
        "access code on any page and come back.</p>" +
      '<p style="margin-top:18px;"><a class="pill go" href="index.html">Open the app</a></p>' +
    "</div>";
} else {
  const EV = CLIENT ? CLIENT.eventWord.toLowerCase() : "show";
  document.getElementById("root").innerHTML = `
  <div class="wrap">

    <p class="lead">
      Notes for showing ADV Media Teams to a client. What to open, in what order, and what
      each screen is for. Nothing here is a promise about what we will build for them. It
      only describes what is on the screen.
    </p>
    <p class="sub">
      Signed in as <strong>${esc(SESSION.role)}</strong>, session <strong>${esc(SESSION.id)}</strong>.
      Your session has no countdown. It holds for an hour with nothing happening. A client
      session closes itself after 30 minutes.
    </p>

    <h2>Before they are looking</h2>
    <ol class="steps">
      <li>
        <strong>Set the kind of work</strong>
        <span>Press <strong>Client</strong> at the top. Sports, live television, corporate, live
          music or theatre. The schedule, the crew positions, the running order, the checklist
          and the venue in Pathfinder all change with it. It is on
          <strong>${esc(CLIENT ? CLIENT.name : "nothing")}</strong>${CLIENT ? ", " + esc(CLIENT.kind.toLowerCase()) : ""} right now.</span>
      </li>
      <li>
        <strong>Set it to the one they actually do</strong>
        <span>A theatre manager looking at a coin toss is translating in their head while you
          talk. Set it before they are looking, not during.</span>
      </li>
      <li>
        <strong>Check the screen you are sharing</strong>
        <span><strong>Aa</strong> at the top sets light or dark and the text size for every page.
          On a projector or in a bright room, light and one size up.</span>
      </li>
    </ol>

    <h2>The five minute run</h2>
    <p class="sub">Three screens in this order. It covers the crew, the show and the building.</p>
    <ol class="steps">
      <li>
        <strong>Today</strong>
        <span>The screen a crew member opens when they arrive. The next ${esc(EV)}, who is on it,
          who has confirmed, and what is not ready yet.</span>
        <span class="say"><b>What it is for</b>Everybody looking at the same thing, and seeing
          what is not done before it becomes a problem.</span>
      </li>
      <li>
        <strong>Run of Show, then Script</strong>
        <span>Pick a ${esc(EV)} from the list. The running order, shared live, with the producer
          marked. The Script tab beside it is the announcer's read copy for the same ${esc(EV)}.</span>
        <span class="say"><b>What it is for</b>One running order, live for everyone at once,
          instead of a printout that went out of date at four o'clock.</span>
      </li>
      <li>
        <strong>Pathfinder</strong>
        <span>Type a jack, a panel or a room into Find it. It walks the chain from the box to the
          rack. Hand them the keyboard for this one rather than typing it yourself.</span>
        <span class="say"><b>What it is for</b>Every cable, panel, rack and drawing for the
          building, on a phone, with no signal needed.</span>
      </li>
    </ol>

    <h2>If they want to see more</h2>
    <dl class="tabs">
      <div><dt>Profile</dt><dd>A crew member's own details. Invoices and shifts are matched to this.</dd></div>
      <div><dt>ID Card</dt><dd>The credential they show at the gate, built from the profile.</dd></div>
      <div><dt>Gear</dt><dd>Case seals and cable runs, updated by whoever is holding them.</dd></div>
      <div><dt>Shifts</dt><dd>Open shifts to pick up or drop. Admins assign and reassign here.</dd></div>
      <div><dt>My Invoices</dt><dd>What a crew member has billed and what has been paid.</dd></div>
      <div><dt>Equipment</dt><dd>The after-shift report. What came back, what did not, what broke.</dd></div>
      <div><dt>Admin</dt><dd>The office side. Crew, approvals, rates, payments, call times, reports.
        Open this one only if they ask what the office sees.</dd></div>
    </dl>
    <div class="card">
      <h3>The other three pages</h3>
      <p><strong>Time Clock</strong>, clock in and out with no login and submit the invoice for it.
        <strong>Checklist</strong>, position by position sign-off before a ${esc(EV)}, shared with the
        whole crew as it fills in. <strong>Pathfinder</strong> also opens on its own with a code
        instead of a login, which is how a visiting engineer gets handed a link.</p>
    </div>

    <h2>Answers you will need</h2>
    <div class="card">
      <div class="qa">
        <p class="q">Is any of this real?</p>
        <p class="a">No. Every venue, show, name and number is made up for the demo. They can
          change anything on screen. Nothing is saved and nothing reaches a real system.</p>
      </div>
      <div class="qa">
        <p class="q">Can the crew see each other's rates?</p>
        <p class="a">No. A crew member sees their own rate on their own invoice, in the app. The
          Time Clock does not show a rate at all.</p>
      </div>
      <div class="qa">
        <p class="q">Does everyone need a login?</p>
        <p class="a">The app yes, the Time Clock and the Checklist no. That is deliberate: at four
          o'clock nobody has time for one. Pathfinder on its own takes a code rather than a login,
          so a visiting engineer can be handed a link without being added to the roster.</p>
      </div>
      <div class="qa">
        <p class="q">Does it work without signal?</p>
        <p class="a">Pathfinder is one file and keeps working once it is open. Anything that shares
          between people needs a connection, because sharing is the whole point of it.</p>
      </div>
      <div class="qa">
        <p class="q">Can we have it with our own shows in it?</p>
        <p class="a">That one goes to Dusty. It is not an answer to give in the room.</p>
      </div>
    </div>

    <h2>Two things not to do</h2>
    <div class="card note">
      <h3>Do not give a price or a date</h3>
      <p>Anything about cost, timing or what gets built goes back to Dusty. Say you will find out
        rather than guessing while they are watching.</p>
    </div>
    <div class="card">
      <h3>Do not let the sample data pass as real</h3>
      <p>If somebody asks whether that is a real venue, say no. The demo says so in the banner and
        in the watermark, and being straight about it costs nothing.</p>
    </div>

    <h2>The session</h2>
    <div class="card">
      <h3>Your code and theirs</h3>
      <p><code>ADV-REP</code> signs you in with no timer. Stay signed in as yourself while you
        drive. To leave them with it afterwards, press <strong>Leave</strong>, then let them press
        <strong>Start the 30-minute demo</strong>, which closes itself.</p>
    </div>
    <div class="card">
      <h3>One sign-in, every page</h3>
      <p>The code is asked for once. Every page and every tab is signed in after that, and it stays
        that way until an hour passes with nothing happening anywhere. A client gets half that.
        Leave, on any page, ends it everywhere.</p>
    </div>

    <div style="margin-top:30px; display:flex; gap:10px; flex-wrap:wrap;">

    </div>

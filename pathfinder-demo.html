<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pathfinder — Demo</title>
<!--
  PATHFINDER, DEMO BUILD
  ======================
  The same shape as the real one: this page is only a gate and a frame.
  Pathfinder itself lives in pathfinder-view-demo.html, which the Pathfinder
  tab in ADV Media Teams frames as well. Upload both.

  Everything the finder shows describes a venue that does not exist, so
  there is nothing here worth protecting. The gate is kept because the real
  hand-out page has one, and a demo that skips it is not showing the product.
-->
<style>
  /* Fallback only. adv-theme.js loads after this and redefines the same
     variables at the same specificity, so the shared theme wins wherever it
     is present. Dark, because dark is the shared theme's default too. */
  :root {
    --bg:#0f1115; --panel:#171a20; --panel2:#1f232b; --border:#2b303a;
    --text:#e8eaed; --text-muted:#a2a9b4; --text-faint:#747c88;
    --accent:#4d8dfc; --accent-ink:#06101f;
    --warn-bg:#2a2214; --warn-ink:#e3bf80;
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.4);
    --font: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  /* html[...] and not :root[...], to match the shared theme's own selector.
     At equal specificity the later rule wins, and the theme's style element
     is appended after this one. */
  html[data-theme="light"] {
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f4; --border:#d7dae1;
    --text:#14161a; --text-muted:#525862; --text-faint:#80868f;
    --accent:#1f6feb; --accent-ink:#ffffff;
    --warn-bg:#fdf3e0; --warn-ink:#7a5218;
    --shadow:0 1px 3px rgba(0,0,0,.09), 0 8px 24px rgba(0,0,0,.06);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; height:100%; }
  body {
    background:var(--bg); color:var(--text); font-family:var(--font);
    display:flex; flex-direction:column; min-height:100%; font-size:14px;
  }
  /* The body is the column; #root has to be one too, or the frame below it
     has nothing to stretch against and collapses to its own content height. */
  #root { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }

  .bar {
    display:flex; align-items:center; gap:10px; flex:0 0 auto; flex-wrap:wrap;
    padding:9px 14px; background:var(--panel); border-bottom:1px solid var(--border);
  }
  .bar h1 { font-size:14.5px; font-weight:800; margin:0; letter-spacing:.2px; }
  .bar .sub { font-size:11px; color:var(--text-faint); margin-top:1px; }
  .brand-logo { height:30px; width:auto; flex:0 0 auto; }
  /* The mark is light grey and vanishes on a light background. The shared
     theme already inverts .brand-logo for every light theme it knows about;
     this only has to cover the standalone fallback. */
  html[data-theme="light"] .brand-logo { filter:invert(1) brightness(.4); }
  .bar-spacer { margin-left:auto; }
  .pill {
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:9px; padding:8px 12px; font-size:12.5px; font-weight:800;
    font-family:inherit; cursor:pointer; flex:0 0 auto; text-decoration:none;
  }
  .pill:active { transform:translateY(1px); }
  .tag {
    font-size:10px; font-weight:800; letter-spacing:.9px; text-transform:uppercase;
    padding:3px 7px; border-radius:6px; background:var(--warn-bg); color:var(--warn-ink);
    border:1px solid var(--border);
  }
  #clockbar {
    flex:0 0 auto; padding:7px 14px; font-size:12px; font-weight:700;
    background:var(--warn-bg); color:var(--warn-ink); border-bottom:1px solid var(--border);
  }
  #frameWrap { flex:1 1 auto; min-height:0; display:flex; }
  #pfFrame { flex:1 1 auto; width:100%; border:0; background:var(--panel); display:block; }

  .gate-wrap { flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:20px; }
  .gate {
    width:100%; max-width:390px; background:var(--panel); border:1px solid var(--border);
    border-radius:16px; padding:22px; box-shadow:var(--shadow);
  }
  .gate-logo { height:42px; width:auto; display:block; margin:0 auto 16px; }
  .gate h2 { font-size:18px; font-weight:800; margin:0 0 6px; text-align:center; }
  .gate p { font-size:12.5px; color:var(--text-muted); line-height:1.55; margin:0 0 18px; text-align:center; }
  .gate label {
    display:block; font-size:11px; font-weight:800; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:.7px; margin-bottom:7px;
  }
  .gate input {
    width:100%; padding:13px 14px; border-radius:11px; font-size:16px; font-family:var(--mono);
    letter-spacing:1px; text-transform:uppercase;
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
  }
  .gate .go {
    width:100%; margin-top:12px; padding:14px 0; border:none; border-radius:11px;
    background:var(--accent); color:var(--accent-ink); font-size:15px; font-weight:800;
    font-family:inherit; cursor:pointer;
  }
  .gate .ghost {
    width:100%; margin-top:10px; padding:12px 0; border-radius:11px; cursor:pointer;
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    font-size:13px; font-weight:800; font-family:inherit;
  }
  .gate .rule { margin:18px 0 14px; border-top:1px solid var(--border); }
  .legal { margin-top:18px; font-size:10.5px; line-height:1.6; color:var(--text-faint); text-align:center; }
  .msg { margin-top:9px; font-size:12px; min-height:16px; }
  .msg.bad { color:#c0392b; }
  html:not([data-theme="light"]) .msg.bad { color:#ff8a7a; }

  #wm {
    position:fixed; inset:0; pointer-events:none; z-index:9999;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #wm span {
    font-size:min(5.5vw, 42px); font-weight:800; letter-spacing:2px; white-space:nowrap;
    color:var(--text); opacity:.055; transform:rotate(-28deg); text-align:center; line-height:2.4;
  }
</style>
<!-- Shared with every other demo page: one appearance setting, stored once. -->
<script src="adv-theme.js"></script>
<!-- One sign-in for the whole demo. The code is asked for once and the
     session is shared with every other page and tab until it goes idle. -->
<script src="demo-session.js"></script>
</head>

const session = { role: null, id: null, timer: null };

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function el(id) { return document.getElementById(id); }

function sessionId() {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for (let i = 0; i < 6; i++) out += a[Math.floor(Math.random() * a.length)];
  return out;
}

function mountWatermark() {
  if (el("wm")) return;
  const d = document.createElement("div");
  d.id = "wm";
  d.innerHTML = "<span>" + esc(DEMO.COMPANY) + " &middot; DEMO &middot; " + esc(session.id) + "</span>";
  document.body.appendChild(d);
}

function lockDown() {
  // Not a lock. It slows down the casual "save page as" and leaves the
  // watermark in any screenshot, which is the part that matters.
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("keydown", (e) => {
    const k = (e.key || "").toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === "s" || k === "p" || k === "u")) e.preventDefault();
  });
}

function startClientClock() {
  if (session.timer) clearInterval(session.timer);
  session.timer = setInterval(tickClock, 1000);
  tickClock();
}
// The clock reads the shared session rather than its own start time, so a
// client who moves between pages carries on from where they were instead of
// collecting a fresh half hour on each one.
function tickClock() {
  const e = el("clockleft");
  if (!e) return;
  const ms = window.ADVDemoSession ? window.ADVDemoSession.msLeft() : null;
  const left = ms == null ? 0 : ms;
  if (left <= 0) { clearInterval(session.timer); session.timer = null; endSession(); return; }
  const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
  e.textContent = m + ":" + String(s).padStart(2, "0");
}
function endSession(why) {
  if (session.timer) { clearInterval(session.timer); session.timer = null; }
  session.role = null;
  if (window.ADVDemoSession) window.ADVDemoSession.end(why);
  el("root").innerHTML =
    '<div class="gate-wrap"><div class="gate">' +
      "<h2>The demo session has ended</h2>" +
      "<p>" + (why === "idle"
        ? "It closes after " + DEMO.IDLE_MINUTES + " minutes with nothing happening. Enter your code to pick it up again."
        : "It runs for " + DEMO.CLIENT_MINUTES + " minutes. Ask your ADV Media contact to start another one.") + "</p>" +
    "</div></div>";
  const wm = el("wm"); if (wm) wm.remove();
}

function renderGate() {
  el("root").innerHTML =
    '<div class="gate-wrap"><div class="gate">' +
      '<img class="gate-logo brand-logo" src="' + LOGO + '" alt="ADV Media" />' +
      "<h2>Pathfinder</h2>" +
      "<p>Every cable, panel, rack and drawing for a venue, in one place, on a phone, " +
        "with no signal needed. This is a sample venue built for the demo.</p>" +
      '<button class="go" id="startClient">Start the ' + DEMO.CLIENT_MINUTES + "-minute demo</button>" +
      '<div style="margin-top:10px; text-align:center; font-size:11.5px; color:var(--text-faint);">' +
        "Sample data only. The session closes itself after " + DEMO.CLIENT_MINUTES + " minutes.</div>" +
      '<div style="text-align:center; margin-top:13px;">' +
        '<a href="how-to-demo.html" style="font-size:12.5px; font-weight:700; ' +
        'color:var(--accent); text-decoration:none;">How to use this &rarr;</a></div>' +
      '<div class="rule"></div>' +
      '<label for="code">ADV Media staff</label>' +
      '<input id="code" placeholder="Access code" autocomplete="off" spellcheck="false" />' +
      '<button class="ghost" id="go">Enter</button>' +
      '<div class="msg" id="msg"></div>' +
      '<div class="legal">&copy; ' + new Date().getFullYear() + " " + esc(DEMO.COMPANY) +
        ". Pathfinder&trade; and the workflows shown are the confidential property of " +
        esc(DEMO.COMPANY) + ". Shown under non-disclosure. No reproduction, redistribution " +
        "or derivative use.</div>" +
    "</div></div>";

  el("startClient").onclick = () => enter("client");
  el("go").onclick = tryCode;
  el("code").onkeydown = (e) => { if (e.key === "Enter") tryCode(); };
}

function tryCode() {
  const v = (el("code").value || "").trim().toUpperCase();
  if (v === DEMO.OWNER_CODE) return enter("owner");
  if (v === DEMO.REP_CODE) return enter("rep");
  const m = el("msg");
  m.className = "msg bad";
  m.textContent = v ? "That code was not recognised." : "Enter your access code.";
}

function enter(role) {
  const s = window.ADVDemoSession ? window.ADVDemoSession.start(role) : { role: role, id: sessionId() };
  resume(s);
}

// Used both by a fresh code entry and by a session that was already running
// when this page opened, so there is one path into the app either way.
function resume(s) {
  session.role = s.role;
  session.id = s.id;
  mountWatermark();
  lockDown();
  renderFrame();
  if (s.role === "client") startClientClock();
}

function renderFrame() {
  const timed = session.role === "client";
  el("root").innerHTML =
    '<div class="bar">' +
      '<img class="brand-logo" src="' + LOGO + '" alt="ADV Media" />' +
      "<div><h1>Pathfinder</h1></div>" +
      '<span class="tag">Demo</span>' +
      '<div class="bar-spacer"></div>' +
      '<button class="pill" id="themeBtn">Appearance</button>' +
      '<button class="pill" id="outBtn">Leave</button>' +
    "</div>" +
    (timed
      ? '<div id="clockbar">Demo session <strong id="clockleft">' + DEMO.CLIENT_MINUTES +
        ":00</strong> remaining. Sample venue, sample data.</div>"
      : '<div id="clockbar">Staff session, no timer. Sample venue, sample data.</div>') +
    '<div id="frameWrap"><iframe id="pfFrame" title="Pathfinder" src="' + VIEW_SRC + '"></iframe></div>';

  el("themeBtn").onclick = () => {
    // One picker for the whole demo. The frame below reads the same setting,
    // so it changes with the page around it.
    if (window.ADVTheme && typeof window.ADVTheme.open === "function") { window.ADVTheme.open(); return; }
    const light = document.documentElement.getAttribute("data-theme") === "light";
    if (light) document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", "light");
    reloadFrame();
  };
  el("outBtn").onclick = () => {
    if (session.timer) { clearInterval(session.timer); session.timer = null; }
    session.role = null;
    if (window.ADVDemoSession) window.ADVDemoSession.end("left");
    const wm = el("wm"); if (wm) wm.remove();
    renderGate();
  };
}

// The frame is a separate document, so it reads the stored appearance when it
// loads and not again. Without the shared theme file there is nothing
// listening, so the frame is reloaded to pick the change up.
function reloadFrame() {
  const f = el("pfFrame");
  if (f) f.src = f.src;
}

(function () {
  if (!window.ADVTheme) {
    try {
      const light = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      if (light) document.documentElement.setAttribute("data-theme", "light");
    } catch (e) { /* leave the dark default */ }
  }
  // Already signed in on another page or in another tab: straight in.
  const live = window.ADVDemoSession && window.ADVDemoSession.get();
  if (live) resume(live); else renderGate();

  // And if it ends anywhere, it ends here.
  if (window.ADVDemoSession) {
    window.ADVDemoSession.onChange((s, why) => {
      if (s && !session.role) { resume(s); return; }
      if (!s && session.role) {
        if (session.timer) { clearInterval(session.timer); session.timer = null; }
        session.role = null;
        const wm = el("wm"); if (wm) wm.remove();
        if (why === "idle") endSession("idle"); else renderGate();
      }
    });
  }
})();
</script>
</body>
</html>
